name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build

  package-smoke:
    # The built wheel must work in a bare environment: package data (the
    # bundled catalog) present, entry points runnable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv venv /tmp/wheel-env
      - run: uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
      - run: /tmp/wheel-env/bin/fiscus catalog lint
      - run: /tmp/wheel-env/bin/fiscus find-series "TGA Wednesday level" --limit 1
