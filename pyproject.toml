[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fiscus"
version = "0.3.0"
description = "US economic data MCP server with a curated catalog, provenance, and source caveats."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fiscus contributors" }]
keywords = ["economics", "treasury", "federal-reserve", "mcp", "fiscaldata", "fred"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.28.1,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
fiscus = "fiscus.cli:main"
fiscus-mcp = "fiscus.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fiscus"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "fiscus/catalog"

[tool.hatch.build.targets.sdist]
include = [
  "/catalog",
  "/src",
  "/tests",
  "/scripts",
  "/.github",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["fiscus"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
